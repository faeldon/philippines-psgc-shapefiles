# The new barangays no published boundary describes, approximated for the complete distribution only.
# scripts/approximate_split.py cuts each from its mothers in the base adm4 (source below) with one straight
# line, sized to a target area, and writes approximated.geojson and approximated-report.md beside this
# file. Every shape it makes is indicative: geom_src = approximated, in dist/complete/ only.
#
# The cut: rule = "long-axis" cuts across the mother's longest dimension (its minimum rotated rectangle),
# and the daughter is the end farther from the city's centre (the centroid of the city's barangays,
# away_from_adm3). rule = "toward" cuts across the line from the mothers' centroid to a point, and the
# daughter is the side nearer it.
#
# The size: size = "population" gives the daughter its mother's area times the daughter's share of the
# pair's 2024 population (the 2026-3q PSGC datafile's 2024 CPH column); size = "area" gives it area m².

source = "data/edit/20240210/ph_adm4_20240210.shp"
publication = "2026-3q"

