# The territorial boundaries of two laws' new barangays, transcribed from their technical descriptions.
# scripts/plot_traverse.py plots each polygon from its lines, places it against its mothers in the base
# adm4 (source below), and writes plotted.geojson and plotted-report.md beside this file.
#
# Bearings are written N 45°30' E; each one the law prints differently is under its polygon's
# corrections, with the law's own text. A traverse runs from its tie point to corner 1 (tie_line), then
# corner to corner back to 1 (lines). The tie points' coordinates aren't published, so placement fits
# the plotted shape to its mothers instead (see plot_traverse.py).

source = "data/edit/20240210/ph_adm4_20240210.shp"

[[group]]
name = "Guinhalinan, Barobo"
law = "Republic Act No. 11986 (21 March 2024), section 2"
url = "https://lawphil.net/statutes/repacts/ra2024/ra_11986_2024.html"
mothers = ["PH1606801010"]  # Javier
fit = "edges"
# Corners 6 to 10 run along Batunan and Soriano (Tagbina) and the Municipality of San Francisco
# (Mate): the law's lines 6-7 (Batunan), 7-8-9 (printed SORLANO) and 9-10 (San Francisco).
edges = [6, 10]
adjoins = ["PH1606817001", "PH1606817020", "PH1600308010"]  # Batunan, Soriano, Mate

