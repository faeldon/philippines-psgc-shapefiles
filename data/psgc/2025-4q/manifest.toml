# PSA's 2025-4q PSGC publication: its raw files in data/psgc/raw/2025-4q/ and their extract here.

id = "2025-4q"
as_of = "2025-12-31"
announcement = "https://psa.gov.ph/classification/psgc/node/1684082306"

[[files]]
role = "datafile"
name = "PSGC-4Q-2025-Publication-Datafile.xlsx"
url = "https://psa.gov.ph/system/files/scd/PSGC-4Q-2025-Publication-Datafile.xlsx"
sha256 = "2a4cbe8ea66304e3ca2f23d0b4118628a4fd55464384b476aeefd4f0fecd8f9b"
sheets = { psgc = "PSGC", national_summary = "National Summary", prov_summary = "Prov Sum" }

[[files]]
role = "summary_of_changes"
name = "PSGC-4Q-2025-Summary-of-Changes.xlsx"
url = "https://psa.gov.ph/system/files/scd/PSGC-4Q-2025-Summary-of-Changes.xlsx"
sha256 = "58f36edc5803f50e91b4c9546670ab6fa3164d16e32ec0827b7a54197b540887"
sheets = { log = "2001-present-copy" }
# The log's sections that are this publication's.
sections = ["October to December 2025"]

[layout]
# The PSGC sheet's columns, by position (PSA's header beside each).
columns = [
    "psgc_code",   # 10-digit PSGC
    "name",        # Name
    "corr_code",   # Correspondence Code
    "geo_level",   # Geographic Level
    "old_names",   # Old names
    "city_class",  # City Class
    "inc_class",   # Income Classification (DOF DO No. 074.2024)
    "urb_rur",     # Urban / Rural (based on 2020 CPH)
    "pop_2024",    # 2024 Population
    "_blank_9",    # (no header)
    "status",      # Status
]
drop = ["_blank_9"]
# The datafile has no NCR district rows.
add_rows = [
  { code = 1303900000, name = "NCR, City of Manila, First District (Not a Province)", geo_level = "Dist" },
  { code = 1307400000, name = "NCR, Second District (Not a Province)", geo_level = "Dist" },
  { code = 1307500000, name = "NCR, Third District (Not a Province)", geo_level = "Dist" },
  { code = 1307600000, name = "NCR, Fourth District (Not a Province)", geo_level = "Dist" },
]
