# PSA's 2025-2q PSGC publication: its raw files in data/psgc/raw/2025-2q/ and their extract here.

id = "2025-2q"
as_of = "2025-06-30"
announcement = "https://psa.gov.ph/classification/psgc/node/1684077694"

[[files]]
role = "datafile"
name = "PSGC-2Q-2025-Publication-Datafile.xlsx"
url = "https://psa.gov.ph/system/files/scd/PSGC-2Q-2025-Publication-Datafile.xlsx"
sha256 = "fd6db9a11e75fbc4cb9c0717e3ceaf5f7825734ee166d44e8e3393613b8b2117"
sheets = { psgc = "PSGC", national_summary = "National Summary", prov_summary = "Prov Sum" }

[[files]]
role = "summary_of_changes"
name = "PSGC-2Q-2025-Summary-of-Changes.xlsx"
url = "https://psa.gov.ph/system/files/scd/PSGC-2Q-2025-Summary-of-Changes.xlsx"
sha256 = "e9e642b02d0327ac21906666fe7bdc51dce9fefd9beb9afe5186c9f242447d28"
sheets = { log = "2001-present" }
# The log's sections that are this publication's.
sections = ["April to June 2025"]

[layout]
# The PSGC sheet's columns, by position (PSA's header beside each).
columns = [
    "psgc_code",   # 10-digit PSGC
    "name",        # Name
    "corr_code",   # Correspondence Code
    "geo_level",   # Geographic Level
    "old_names",   # Old names
    "city_class",  # City Class
    "inc_class",   # Income Classification (DOF DO No. 074.2024)
    "urb_rur",     # Urban / Rural (based on 2020 CPH)
    "pop_2020",    # 2020 Population
    "_blank_9",    # (no header)
    "status",      # Status
]
drop = ["_blank_9"]
# The datafile has no NCR district rows.
add_rows = [
  { code = 1303900000, name = "NCR, City of Manila, First District (Not a Province)", geo_level = "Dist" },
  { code = 1307400000, name = "NCR, Second District (Not a Province)", geo_level = "Dist" },
  { code = 1307500000, name = "NCR, Third District (Not a Province)", geo_level = "Dist" },
  { code = 1307600000, name = "NCR, Fourth District (Not a Province)", geo_level = "Dist" },
]
