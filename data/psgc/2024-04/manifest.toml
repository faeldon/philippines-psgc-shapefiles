# PSA's 2024-04 PSGC publication: its raw files in data/psgc/raw/2024-04/ and their extract here.

id = "2024-04"
as_of = "2024-04-30"
announcement = "https://psa.gov.ph/classification/psgc/node/1684063552"

[[files]]
role = "datafile"
name = "PSGC-April-2024-Publication-Datafile.xlsx"
url = "https://psa.gov.ph/system/files/scd/PSGC-April-2024-Publication-Datafile.xlsx"
sha256 = "fc6e22e0ee1f65d658f94be4933da3498215202cec93c5248ba823c891994cb8"
sheets = { psgc = "PSGC", national_summary = "National Summary", prov_summary = "Prov Sum" }

[[files]]
role = "summary_of_changes"
name = "PSGC-April-2024-Summary-of-Changes.xlsx"
url = "https://psa.gov.ph/system/files/scd/PSGC-April-2024-Summary-of-Changes.xlsx"
sha256 = "5eed0558f52a48075dd5b32890fecfaa3d885e620983804a19e38aef1fa82dc7"
sheets = { log = "2001-present" }
# The log's sections that are this publication's.
sections = ["April 2024"]

[layout]
# The PSGC sheet's columns, by position (PSA's header beside each).
columns = [
    "psgc_code",   # 10-digit PSGC
    "name",        # Name
    "corr_code",   # Correspondence Code
    "geo_level",   # Geographic Level
    "old_names",   # Old names
    "city_class",  # City Class
    "inc_class",   # Income Classification
    "urb_rur",     # Urban / Rural (based on 2020 CPH)
    "pop_2020",    # 2020 Population
    "_blank_9",    # (no header)
    "status",      # Status
]
drop = ["_blank_9"]
# The datafile has no NCR district rows.
add_rows = [
  { code = 1303900000, name = "NCR, City of Manila, First District (Not a Province)", geo_level = "Dist" },
  { code = 1307400000, name = "NCR, Second District (Not a Province)", geo_level = "Dist" },
  { code = 1307500000, name = "NCR, Third District (Not a Province)", geo_level = "Dist" },
  { code = 1307600000, name = "NCR, Fourth District (Not a Province)", geo_level = "Dist" },
]
