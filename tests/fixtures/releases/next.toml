# Test fixture: a hypothetical next quarter, made from releases/2023-4q.toml with two changes and no code
# change: it joins a new publication (tests/fixtures/psgc/next/, whose datafile gains a blank first
# column and has no NCR district rows, as the 2024+ datafiles do), and municities gains one override.

id = "next"

[psgc]
publication = "next"

[sources.country]
path = "data/2023/Country/phl_admbnda_adm0_singlepart_psa_namria_20231106.shp"
columns = [
    "shape_len",
    "shape_area",
    "adm0_en",
    "adm0_pcode",
    "date",
    "valid_on",
    "valid_to",
    "geometry",
]

[sources.region]
path = "data/2023/Regions/phl_admbnda_adm1_psa_namria_20231106.shp"
