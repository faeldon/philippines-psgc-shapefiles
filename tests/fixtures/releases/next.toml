    "adm1_en",
    "adm1_pcode",
    "adm0_en",
    "adm0_pcode",
    "date",
    "valid_on",
    "valid_to",
    "shape_len",
    "shape_area",
    "adm1_alt",
    "shape_sqkm",
    "geometry",
]

[sources.provdists]
path = "data/2023/Provdists/phl_admbnda_adm2_psa_namria_20231106.shp"
columns = [
    "adm2_en",
    "adm2_pcode",
    "adm1_en",
    "adm1_pcode",
    "adm0_en",
